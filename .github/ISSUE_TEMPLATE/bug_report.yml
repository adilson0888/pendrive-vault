name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The diagnostics below usually identify the
        problem immediately — please fill them in rather than deleting them.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you click, and what did the app do instead?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: dropdown
    id: unlock-path
    attributes:
      label: Which unlock path fails?
      options:
        - FIDO2 key
        - Passphrase
        - Both
        - Not sure / the volume is not detected
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Distribution and desktop
      placeholder: CachyOS 2026.11, COSMIC on Wayland
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: cryptsetup and systemd versions
      description: "Output of: `cryptsetup --version` and `systemctl --version | head -1`"
    validations:
      required: true

  - type: input
    id: token
    attributes:
      label: FIDO2 key model
      description: Only if the FIDO2 path is involved. `fido2-token -L` shows the node.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste the app's **Details** panel, plus:
        `sudo cat /run/pendrive-vault/last.log`
        `sudo cat /run/pendrive-vault/token-debug.log`
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I removed secrets from the pasted logs
          required: true
        - label: I am running the latest version of the app
          required: true
